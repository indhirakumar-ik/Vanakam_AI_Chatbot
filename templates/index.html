<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vanakam AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- Animated Background -->

    <div class="background">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- CHATBOT -->

    <div class="chatbot">


        <!-- HEADER -->

        <header class="chat-header">

            <div class="profile">

                <div class="avatar">

                    <div class="robot-face">
                        ⚇
                    </div>

                    <span class="online-dot"></span>

                </div>


                <div class="profile-info">

                    <h2>Vanakam AI</h2>

                    <p>
                        <span class="pulse"></span>
                        Online
                    </p>

                </div>

            </div>


            <!-- <div class="header-buttons">

                <button title="Settings">
                    ⚙
                </button> -->

                <!-- <button title="More">
                    ⋮
                </button>

            </div> -->

        </header>



        <!-- CHAT -->

        <main class="chat-area" id="chatArea">


            <!-- Welcome -->

            <div class="welcome">

                <div class="welcome-icon">
                    ✨
                </div>

                <h1>Hello there!</h1>

                <p>
                    I'm Vanakam, your AI assistant.
                </p>

                <div class="suggestions">

                    <button onclick="sendSuggestion('Hii')">
                        👋 Say Hi
                    </button>

                    <button onclick="sendSuggestion('Who are you')">
                        🤖 Who are you?
                    </button>

                    <button onclick="sendSuggestion('How are you')">
                        💬 How are you?
                    </button>

                </div>

            </div>


        </main>



        <!-- INPUT -->

        <footer class="input-area">


            <!-- <button class="icon-button">
                📎
            </button> -->


            <div class="input-wrapper">

                <input
                    type="text"
                    id="userInput"
                    placeholder="Message Vanakam...."
                    autocomplete="off"
                >

                <span class="typing-cursor"></span>

            </div>


            <button
                id="sendButton"
                class="send-button">

                <span>➤</span>

            </button>


        </footer>


        <p class="powered">
            Powered by Vanakam AI • Responses may vary
        </p>


    </div>



<script>


const input =
    document.getElementById("userInput");


const sendButton =
    document.getElementById("sendButton");


const chatArea =
    document.getElementById("chatArea");



/* ==============================
   SEND BUTTON
   ============================== */

sendButton.addEventListener(
    "click",
    sendMessage
);



/* ==============================
   ENTER KEY
   ============================== */

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);



/* ==============================
   SUGGESTION BUTTON
   ============================== */

function sendSuggestion(message) {

    input.value = message;

    sendMessage();

}



/* ==============================
   SEND MESSAGE
   ============================== */

async function sendMessage() {

    const message =
        input.value.trim();


    if (message === "") {

        return;

    }


    addUserMessage(message);


    input.value = "";


    /* Typing indicator */

    const typing =
        createTypingIndicator();


    chatArea.appendChild(typing);


    scrollToBottom();



    try {

        const response =
            await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    message: message
                })

            });



        const data =
            await response.json();



        /* Remove typing */

        typing.remove();


        /* Add bot response */

        addBotMessage(
            data.response
        );


    }

    catch (error) {

        typing.remove();

        addBotMessage(
            "Something went wrong 😢"
        );

        console.error(error);

    }

}



/* ==============================
   USER MESSAGE
   ============================== */

function addUserMessage(message) {

    const messageBox =
        document.createElement("div");


    messageBox.className =
        "message user-message";


    messageBox.innerHTML = `

        <div class="bubble">

            <p>${message}</p>

            <span>Now</span>

        </div>

    `;


    chatArea.appendChild(messageBox);


    scrollToBottom();

}



/* ==============================
   BOT MESSAGE
   ============================== */

function addBotMessage(message) {

    const messageBox =
        document.createElement("div");


    messageBox.className =
        "message bot-message";


    messageBox.innerHTML = `

        <div class="small-avatar">
            🤖
        </div>

        <div class="bubble">

            <p>${message}</p>

            <span>Now</span>

        </div>

    `;


    chatArea.appendChild(messageBox);


    scrollToBottom();

}



/* ==============================
   TYPING INDICATOR
   ============================== */

function createTypingIndicator() {

    const typing =
        document.createElement("div");


    typing.className =
        "message bot-message typing-message";


    typing.innerHTML = `

        <div class="small-avatar">
            🤖
        </div>

        <div class="typing-bubble">

            <i></i>
            <i></i>
            <i></i>

        </div>

    `;


    return typing;

}



/* ==============================
   AUTO SCROLL
   ============================== */

function scrollToBottom() {

    chatArea.scrollTo({

        top: chatArea.scrollHeight,

        behavior: "smooth"

    });

}


</script>

</body>
<!-- Swarm Cursor -->
<div class="swarm-cursor">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<script>
const swarm = document.querySelector(".swarm-cursor");
const particles = swarm.querySelectorAll("span");

let mouseX = 0;
let mouseY = 0;

document.addEventListener("mousemove", (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

particles.forEach((particle, index) => {

    let x = mouseX;
    let y = mouseY;

    function animate() {

        x += (mouseX - x) * (0.15 - index * 0.005);
        y += (mouseY - y) * (0.15 - index * 0.005);

        particle.style.transform =
            `translate(${x}px, ${y}px)`;

        requestAnimationFrame(animate);
    }

    animate();

});
</script>
</html>
